# GitHub stays origin. This job mirrors HEAD to GitLawb and comments the cert.
# Add repo secret GITLAWB_IDENTITY_PEM (the contents of identity.pem).
# Mirrors are public. Do not enable this on private source.

name: GitLawb sidecar
on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sync signed mirror
        run: npx --yes gitlawb-sidecar@0.1.0 sync --comment-pr
        env:
          GITLAWB_IDENTITY_PEM: ${{ secrets.GITLAWB_IDENTITY_PEM }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
